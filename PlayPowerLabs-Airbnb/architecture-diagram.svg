<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Production architecture for a vacation rental marketplace</title>
  <desc id="desc">Users connect through a CDN to a frontend, API gateway, services, data stores, search, media storage, and observability.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#555"/></marker><style>text{font-family:Arial,sans-serif;fill:#17202a}.title{font-size:28px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:13px}.box{fill:#fff;stroke:#8996a3;stroke-width:2}.edge{stroke:#555;stroke-width:2;fill:none;marker-end:url(#arrow)}.group{fill:#f5f7f9;stroke:#c6ced6;stroke-width:2;stroke-dasharray:7 6}</style></defs>
  <rect width="1400" height="820" fill="#fff"/><text x="700" y="48" text-anchor="middle" class="title">Vacation Rental Marketplace - Production Architecture</text>
  <rect x="40" y="100" width="220" height="150" rx="14" class="box"/><text x="150" y="135" text-anchor="middle" class="label">Clients</text><text x="150" y="170" text-anchor="middle" class="small">Desktop web</text><text x="150" y="195" text-anchor="middle" class="small">Mobile web</text><text x="150" y="220" text-anchor="middle" class="small">Accessible UI</text>
  <rect x="330" y="100" width="220" height="150" rx="14" class="box"/><text x="440" y="135" text-anchor="middle" class="label">Edge and delivery</text><text x="440" y="170" text-anchor="middle" class="small">CDN + WAF</text><text x="440" y="195" text-anchor="middle" class="small">Static assets</text><text x="440" y="220" text-anchor="middle" class="small">TLS and caching</text>
  <rect x="620" y="100" width="220" height="150" rx="14" class="box"/><text x="730" y="135" text-anchor="middle" class="label">Frontend</text><text x="730" y="170" text-anchor="middle" class="small">React / Next.js</text><text x="730" y="195" text-anchor="middle" class="small">SSR and hydration</text><text x="730" y="220" text-anchor="middle" class="small">Feature analytics</text>
  <rect x="910" y="100" width="220" height="150" rx="14" class="box"/><text x="1020" y="135" text-anchor="middle" class="label">API gateway</text><text x="1020" y="170" text-anchor="middle" class="small">Auth and rate limits</text><text x="1020" y="195" text-anchor="middle" class="small">Request routing</text><text x="1020" y="220" text-anchor="middle" class="small">Observability hooks</text>
  <rect x="1180" y="100" width="180" height="150" rx="14" class="box"/><text x="1270" y="135" text-anchor="middle" class="label">Identity</text><text x="1270" y="170" text-anchor="middle" class="small">OAuth / sessions</text><text x="1270" y="195" text-anchor="middle" class="small">RBAC</text><text x="1270" y="220" text-anchor="middle" class="small">Secrets manager</text>
  <path d="M260 175h70M550 175h70M840 175h70M1130 175h50" class="edge"/>
  <rect x="360" y="330" width="680" height="190" rx="14" class="group"/><text x="700" y="360" text-anchor="middle" class="label">Domain services</text>
  <rect x="390" y="390" width="180" height="90" rx="10" class="box"/><text x="480" y="425" text-anchor="middle" class="label">Listings</text><text x="480" y="450" text-anchor="middle" class="small">Availability and pricing</text>
  <rect x="610" y="390" width="180" height="90" rx="10" class="box"/><text x="700" y="425" text-anchor="middle" class="label">Bookings</text><text x="700" y="450" text-anchor="middle" class="small">Payments and events</text>
  <rect x="830" y="390" width="180" height="90" rx="10" class="box"/><text x="920" y="425" text-anchor="middle" class="label">Reviews</text><text x="920" y="450" text-anchor="middle" class="small">Ratings and moderation</text>
  <path d="M1020 250v70M1020 320H480v70M1020 320h-100v70M1020 320H700v70" class="edge"/>
  <rect x="70" y="600" width="230" height="130" rx="14" class="box"/><text x="185" y="635" text-anchor="middle" class="label">Primary database</text><text x="185" y="670" text-anchor="middle" class="small">PostgreSQL</text><text x="185" y="695" text-anchor="middle" class="small">Read replicas and backups</text>
  <rect x="390" y="600" width="230" height="130" rx="14" class="box"/><text x="505" y="635" text-anchor="middle" class="label">Search</text><text x="505" y="670" text-anchor="middle" class="small">OpenSearch / Elasticsearch</text><text x="505" y="695" text-anchor="middle" class="small">Geo and availability filters</text>
  <rect x="710" y="600" width="230" height="130" rx="14" class="box"/><text x="825" y="635" text-anchor="middle" class="label">Media storage</text><text x="825" y="670" text-anchor="middle" class="small">Object storage</text><text x="825" y="695" text-anchor="middle" class="small">Image resizing CDN</text>
  <rect x="1030" y="600" width="300" height="130" rx="14" class="box"/><text x="1180" y="635" text-anchor="middle" class="label">Platform operations</text><text x="1180" y="670" text-anchor="middle" class="small">Redis cache - queues - metrics</text><text x="1180" y="695" text-anchor="middle" class="small">Logs - traces - alerts</text>
  <path d="M480 480v100M700 480v100M920 480v100M480 520v60M920 520v60M700 520v60" class="edge"/><path d="M1020 520v60h160v20" class="edge"/>
</svg>